# Local development only. Ports and test credentials must not be exposed publicly.
services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: sdc
      POSTGRES_PASSWORD: sdc_local
      POSTGRES_DB: sdc
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdc -d sdc"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 200
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SDC_DATABASE_URL: postgresql+psycopg://sdc:sdc_local@db:5432/sdc
    command: ["python", "-m", "alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SDC_DATABASE_URL: postgresql+psycopg://sdc:sdc_local@db:5432/sdc
      SDC_PUBLIC_URL: http://127.0.0.1:5173
      SDC_SMTP_HOST: mailpit
      SDC_ARTIFACT_DIR: /app/artifacts/runs
    volumes:
      - analysis-artifacts:/app/artifacts:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SDC_DATABASE_URL: postgresql+psycopg://sdc:sdc_local@db:5432/sdc
      SDC_ARTIFACT_DIR: /app/artifacts/runs
    command: ["python", "-m", "app.analyses.worker"]
    init: true
    stop_grace_period: 30s
    mem_limit: 1536m
    pids_limit: 64
    volumes:
      - analysis-artifacts:/app/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.analyses.worker", "--health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/api/v1/ready').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy
volumes:
  analysis-artifacts:
  postgres-data:
