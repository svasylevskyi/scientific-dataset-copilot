[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "scientific-dataset-copilot"
version = "0.1.0"
description = "Scientific Dataset Copilot API and reproducible SST reference workflow"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "httpx[socks]>=0.28,<1",
  "xarray>=2025.1,<2027",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
sdc-reference = "app.sst.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
