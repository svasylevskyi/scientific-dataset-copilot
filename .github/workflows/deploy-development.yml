name: Deploy development
run-name: Deploy development from main by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.repository == 'svasylevskyi/scientific-dataset-copilot'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: development
      url: https://scientific-dataset-copilot.duckdns.org
    steps:
      - name: Require successful CI for this exact main commit
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Reuse CI on main; never deploy an unchecked commit or a PR test merge.
          for attempt in {1..30}; do
            result=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f event=push -f branch=main -f head_sha="$GITHUB_SHA" -f per_page=1 \
              --jq '.workflow_runs[0] | [.status // "missing", .conclusion // "none", .html_url // "none"] | @tsv')
            IFS=$'\t' read -r status conclusion url <<< "$result"
            if [[ "$status" == completed ]]; then
              if [[ "$conclusion" != success ]]; then
                echo "::error::CI for $GITHUB_SHA finished with $conclusion. See $url"
                exit 1
              fi
              echo "CI passed: $url"
              exit 0
            fi
            echo "Waiting for CI on $GITHUB_SHA ($status; attempt $attempt/30)."
            sleep 20
          done
          echo '::error::CI has not passed within 10 minutes. Check CI, then run this workflow again.'
          exit 1
      - name: Deploy over pinned-host SSH
        timeout-minutes: 27
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEVELOPMENT_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEVELOPMENT_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_SSH_KEY" || -z "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo '::error::Configure DEVELOPMENT_SSH_KEY and DEVELOPMENT_KNOWN_HOSTS in the development environment. See docs/github-deployment.md.'
            exit 1
          fi
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/sdc-deploy.XXXXXX")
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          unset DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS
          ssh -F /dev/null -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            deploy@2.31.42.230 "deploy $GITHUB_SHA"
          {
            printf 'Deployed commit `%s` to [development](https://scientific-dataset-copilot.duckdns.org).\n\n' "$GITHUB_SHA"
            printf 'Database backup, migrations, and container health checks completed.\n'
          } >> "$GITHUB_STEP_SUMMARY"
