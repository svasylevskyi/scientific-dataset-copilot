name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python --version
          node --version
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e ./backend
          python -m pip check
      - name: Scientific and API checks
        run: |
          python -m ruff check backend
          python -m ruff format --check backend
          python -m pytest backend/tests -q -m "not postgres"
      - name: Frontend and generated API contract
        run: |
          npm --prefix frontend ci
          python backend/scripts/export_openapi.py
          npm --prefix frontend run api:types
          git diff --exit-code -- backend/openapi.json frontend/src/api.generated.ts
          npm --prefix frontend run build
      - name: Install browser system dependencies
        # Chromium's headless tests do not need Windows Media Foundation.
        # Installing that optional feature costs 3+ minutes on hosted Windows.
        if: runner.os == 'Linux'
        timeout-minutes: 4
        working-directory: frontend
        run: node node_modules/playwright/cli.js install-deps chromium
      - name: Install Chromium headless shell
        timeout-minutes: 4
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sdc-playwright
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
          DEBUG: pw:install
        run: node node_modules/playwright/cli.js install --only-shell chromium
      - name: Browser checks
        timeout-minutes: 3
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sdc-playwright
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence-${{ matrix.os }}
          path: frontend/test-results
          retention-days: 7
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test local containers
        run: |
          docker compose up -d --build --wait
          curl --fail http://127.0.0.1:5173/api/v1/ready
          curl --fail http://127.0.0.1:8025/livez
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:5173/api/v1/health
          curl --fail --output /dev/null http://127.0.0.1:5173/api/v1/reference.csv
      - name: Container logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down

  accounts:
    name: PostgreSQL accounts and browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: sdc
          POSTGRES_PASSWORD: sdc_test
          POSTGRES_DB: sdc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sdc -d sdc_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.5
        ports:
          - 1025:1025
          - 8025:8025
    env:
      SDC_DATABASE_URL: postgresql+psycopg://sdc:sdc_test@127.0.0.1:5432/sdc_test
      SDC_TEST_DATABASE_URL: postgresql+psycopg://sdc:sdc_test@127.0.0.1:5432/sdc_test
      SDC_ACCOUNT_E2E: '1'
      SDC_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/runs
      SDC_PUBLIC_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e ./backend
          npm --prefix frontend ci
      - name: Migrations, isolation, session lifecycle and concurrency
        timeout-minutes: 3
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m pytest backend/tests -q -m postgres
          python -m alembic -c backend/alembic.ini check
      - name: Install browser system dependencies
        timeout-minutes: 4
        working-directory: frontend
        run: node node_modules/playwright/cli.js install-deps chromium
      - name: Install Chromium headless shell
        timeout-minutes: 4
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sdc-playwright
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
          DEBUG: pw:install
        run: node node_modules/playwright/cli.js install --only-shell chromium
      - name: Account journey with real PostgreSQL and email delivery
        timeout-minutes: 3
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sdc-playwright
        run: npm run test:e2e -- accounts.spec.ts plans.spec.ts analyses.spec.ts
      - name: Upload account browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-browser-evidence
          path: frontend/test-results
          retention-days: 7

  development-deployment:
    name: Protected development deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check deployment script syntax
        run: |
          for script in deploy/development/*.sh; do bash -n "$script"; done
          python3 -m py_compile deploy/development/configure.py deploy/development/smoke.py
      - name: Check deployment command restrictions and locking
        run: python3 -m unittest discover -s deploy/development/tests -v
      - name: Configure and deploy disposable development stack
        run: |
          printf '%s\n%s\n' 'CI-only tester gate password!' 'CI-only tester gate password!' | python3 deploy/development/configure.py localhost
          bash deploy/development/deploy.sh
      - name: Redeploy with the gateway already running
        run: |
          web_id=$(bash deploy/development/compose.sh ps -q web)
          web_started=$(docker inspect --format '{{.State.StartedAt}}' "$web_id")
          bash deploy/development/compose.sh run --rm --no-deps --pull never web-validate
          test "$(docker inspect --format '{{.State.StartedAt}}' "$web_id")" = "$web_started"
          curl --silent --show-error --output /dev/null --write-out '%{http_code}' --insecure https://localhost | grep -qx 401
          # Exercise the real update path, not only a fresh installation.
          bash deploy/development/deploy.sh
      - name: Verify HTTPS, private services, account cookies and SMTP capture
        timeout-minutes: 2
        run: |
          for attempt in {1..20}; do
            if bash deploy/development/compose.sh cp web:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/sdc-dev-root.crt"; then break; fi
            sleep 1
          done
          printf '%s' 'CI-only tester gate password!' | python3 deploy/development/smoke.py https://localhost --ca-file "$RUNNER_TEMP/sdc-dev-root.crt"
          python3 - <<'PY'
          import json, subprocess
          config = json.loads(subprocess.check_output(['bash', 'deploy/development/compose.sh', 'config', '--format', 'json']))
          for name in ['api', 'db', 'migrate', 'worker']:
              assert not config['services'][name].get('ports'), f'{name} must have no host port'
          ports = config['services']['mailpit']['ports']
          assert len(ports) == 1 and ports[0]['host_ip'] == '127.0.0.1' and ports[0]['target'] == 8025
          PY
      - name: Install deployment browser test dependencies
        timeout-minutes: 4
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sdc-playwright
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
        run: |
          npm ci
          node node_modules/playwright/cli.js install-deps chromium
          node node_modules/playwright/cli.js install --only-shell chromium
      - name: Tester gate persists through reloads and app authentication changes
        timeout-minutes: 3
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/sdc-playwright
          SDC_TESTER_PASSWORD: 'CI-only tester gate password!'
        run: node node_modules/playwright/cli.js test --config playwright.development.config.ts
      - name: Upload deployment browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: development-browser-failure-evidence
          path: frontend/test-results
          retention-days: 7
      - name: Deployment logs on failure
        if: failure()
        run: bash deploy/development/compose.sh logs --tail=100
      - name: Stop disposable stack
        if: always()
        run: bash deploy/development/compose.sh down
