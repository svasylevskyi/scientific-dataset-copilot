name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python --version
          node --version
          python -m pip install -r backend/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e ./backend
          python -m pip check
      - name: Scientific and API checks
        run: |
          python -m ruff check backend
          python -m ruff format --check backend
          python -m pytest backend/tests -q
      - name: Frontend and generated API contract
        run: |
          npm --prefix frontend ci
          python backend/scripts/export_openapi.py
          npm --prefix frontend run api:types
          git diff --exit-code -- backend/openapi.json frontend/src/api.generated.ts
          npm --prefix frontend run build
      - name: Browser checks
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence-${{ matrix.os }}
          path: frontend/test-results
          retention-days: 7
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-test local preview containers
        run: |
          docker compose up -d --build --wait
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:5173/api/v1/health
          curl --fail --output /dev/null http://127.0.0.1:5173/api/v1/reference.csv
      - name: Container logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down
